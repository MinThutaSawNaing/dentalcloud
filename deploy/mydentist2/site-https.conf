server {
    listen 80;
    listen [::]:80;
    server_name mydentist2.dentalcloud.asia;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mydentist2-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://mydentist2.dentalcloud.asia$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mydentist2.dentalcloud.asia;

    ssl_certificate /etc/letsencrypt/live/mydentist2.dentalcloud.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mydentist2.dentalcloud.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mydentist2_SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mydentist2.access.log;
    error_log /var/log/nginx/mydentist2.error.log warn;

    location / {
        include /etc/nginx/snippets/mydentist2-upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}