server {
    listen 80;
    listen [::]:80;
    server_name mydentist2.dentalcloud.asia;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mydentist2-acme;
        default_type text/plain;
    }

    # Do not expose a clinical login over unencrypted HTTP before TLS is ready.
    location / {
        default_type text/plain;
        return 503 "DentalCloud is deployed. HTTPS setup is waiting for DNS and certificate issuance.\n";
    }
}